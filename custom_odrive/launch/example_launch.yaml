launch:
- node:
    pkg: "custom_odrive"
    exec: "custom_odrive_node"
    name: "can_node"
    namespace: "odrive_axis0"
    param:
    - name: "node_id"
      value: 0
    - name: "interface"
      value: "can0"
    - name: "axis_idle_on_shutdown"
      value: false
    - name: "control_message_in_radians"
      value: false
    - name: "invert_direction"
      value: false
